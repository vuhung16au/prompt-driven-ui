<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn scattered ideas into clear actions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-blob lavender"></div>
        <div class="aurora-blob mint"></div>
        <div class="aurora-blob peach"></div>
    </div>
    
    <button class="motion-toggle" aria-label="Pause/Play background motion" title="Pause motion">⏸</button>
    
    <main class="container">
        <header class="hero">
            <h1>Turn scattered ideas into <span class="gradient-text">clear actions</span>.</h1>
            <p>Select a sample note set to see how it reorganizes into decisions, action items, and missing pieces.</p>
        </header>

        <section class="tool-section" aria-label="Note organization tool">
            <div class="context-selector" role="tablist" aria-label="Select a sample note set">
                <button class="tab-btn active" role="tab" aria-selected="true" data-dataset="meeting">Project Meeting</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-dataset="article">Article Ideas</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-dataset="plan">Weekly Plan</button>
            </div>

            <div class="panels">
                <!-- Input Panel -->
                <div class="panel input-panel" id="notes">
                    <h2>Source notes</h2>
                    <ul class="notes-list" id="notesList">
                        <!-- Rendered by JS -->
                    </ul>
                    <a href="#output" class="mobile-jump-btn">Jump to results ↓</a>
                </div>

                <!-- Output Panel -->
                <div class="panel output-panel" id="output">
                    <div class="output-header">
                        <h2>Organized summary</h2>
                        <button class="copy-btn" id="copyBtn">Copy markdown</button>
                    </div>
                    <div class="output-content" id="outputContent" aria-live="polite">
                        <!-- Rendered by JS -->
                    </div>
                    <a href="#notes" class="mobile-jump-btn reverse">Back to notes ↑</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
